<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>saved-digest</title>
<style>
:root {
  --bg: #fafaf9; --surface: #fff; --fg: #1c1917; --muted: #57534e; --line: #e7e5e4;
  --accent: #0f766e; --accent-fg: #fff; --hover: #f0efed; --focus: #0f766e;
  --font: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  --col: 200px; --gap: 28px 18px; --pad: 32px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #131211; --surface: #1c1a19; --fg: #f5f5f4; --muted: #a8a29e; --line: #2c2927; --accent: #2dd4bf; --accent-fg: #042f2e; --hover: #232120; --focus: #2dd4bf; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
button, input, textarea { font: inherit; color: inherit; }
svg { width: 18px; height: 18px; flex: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; max-width: 1760px; margin: 0 auto; }
aside { padding: 28px 16px; border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; }
h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0 8px 4px; display: flex; align-items: center; min-height: 44px; } /* same height as the search bar, so they share a centre line */
nav button { display: flex; justify-content: space-between; gap: 8px; width: 100%; min-height: 40px; padding: 8px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; color: var(--muted); }
nav button:hover { background: var(--hover); }
nav button[aria-current="true"] { color: var(--fg); background: var(--hover); font-weight: 600; }
nav .n { font-variant-numeric: tabular-nums; }
main { padding: 0 var(--pad) 80px; min-width: 0; }

.bar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
.search { position: relative; flex: 1 1 280px; min-width: 0; }
.search svg { position: absolute; left: 12px; top: 13px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; min-height: 44px; padding: 0 40px 0 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.search input::-webkit-search-cancel-button { display: none; }
.search .x { position: absolute; right: 4px; top: 2px; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--muted); border-radius: 8px; }
.search .x[hidden] { display: none; }
/* search and view toggle stay at the top while scrolling; --head is the height of the sticky group bar on phones */
.bar { position: sticky; top: var(--head, 0px); z-index: 4; background: var(--bg); padding: 28px 0 14px; margin-bottom: 12px; }
.count { color: var(--muted); font-size: 13px; margin: -12px 0 22px; }
.count:empty { display: none; }

/* the current group's name stays under the search bar while scrolling; each title covers the previous one */
.group-title { position: sticky; top: calc(var(--head, 0px) + var(--bar, 0px)); z-index: 3; background: var(--bg); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 4px; padding: 10px 0; font-weight: 600; }
.group-title:first-child { margin-top: -10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--col), 1fr)); gap: var(--gap); }
/* each card is 4 rows of the shared grid (thumb, name+tags, summary, links), so every section starts level across a row */
.card { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 9px; align-content: start; min-width: 0; }

.thumb { position: relative; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: var(--hover); border: 1px solid var(--line); }
.thumb a { display: block; height: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb a:hover img { filter: brightness(.88); }
.thumb .ph { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }
.thumb .ph svg { width: 28px; height: 28px; display: block; margin: 0 auto 6px; opacity: .6; }

.sum { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.author { font-size: 13px; font-weight: 600; color: var(--fg); overflow-wrap: anywhere; }
.tags { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2.5px; }
/* visible text gaps name→tags : tags→summary are 1:2 (5px : 10px grid, 4px : 8px list); the margins subtract the lines' own leading */
/* each link is a small card: what it is, then where it goes (the address, or the web search it runs) */
/* links of one kind (pages, web searches) share one bubble; each row inside is its own link */
.links { display: grid; gap: 6px; align-content: start; }
.bubble { display: grid; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.links a { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 0 8px; align-items: start; min-height: 44px; padding: 6px 10px; text-decoration: none; }
.links a + a { border-top: 1px solid var(--line); }
.links a:hover { background: var(--hover); }
.links svg { width: 14px; height: 14px; margin-top: 3px; color: var(--accent); }
.links .name { font-size: 13px; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
.links .where { grid-column: 2; font-size: 12px; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; } /* wraps in full, never cut off */
.links .where.url { font-family: var(--mono); }
.empty { color: var(--muted); padding: 48px 0; }

.view { display: flex; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.view button { width: 40px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
.view button:hover { color: var(--fg); }
.view button[aria-pressed="true"] { background: var(--hover); color: var(--fg); }

/* list: same card markup, laid out as rows: thumbnail | text */
#list.list { max-width: 900px; }
.list .grid { display: block; }
.list .card { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 0 16px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.list .card > * { grid-column: 2; }
.list .card > * + * { margin-top: 4px; }
.list .card > :empty { display: none; }
.list .thumb { grid-column: 1; grid-row: 1 / span 6; margin: 0; border-radius: 8px; }
.list .thumb .ph span { display: none; }
.list .tags { margin-top: 1.5px; }
.list .sum { margin-top: 7px; }
.list .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.list .bubble { max-width: 100%; }


@media (min-width: 1500px) { :root { --col: 230px; } }
@media (max-width: 900px) { :root { --col: 170px; --gap: 24px 14px; --pad: 20px; } .app { grid-template-columns: 190px minmax(0, 1fr); } }
@media (max-width: 720px) {
  :root { --col: 150px; --gap: 22px 12px; --pad: 14px; }
  .app { display: block; }
  aside { position: sticky; z-index: 5; height: auto; border-right: 0; border-bottom: 1px solid var(--line); background: var(--bg); padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); }
  h1 { display: none; }
  nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
  nav::-webkit-scrollbar { display: none; }
  nav button { width: auto; flex: none; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
  nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .bar { padding-top: 14px; }
  main { padding: 0 calc(var(--pad) + env(safe-area-inset-right)) 64px calc(var(--pad) + env(safe-area-inset-left)); }
  .search { flex: 1 1 0; }
  .list .card { grid-template-columns: 56px minmax(0, 1fr); gap: 0 12px; }
  .search input { font-size: 16px; } /* 16px stops iOS zooming on focus */
}
@media (max-width: 340px) { :root { --col: 100%; } }
@media (prefers-reduced-motion: no-preference) { nav button, .view button, .links a, .thumb img { transition: background .15s, filter .15s, opacity .15s; } }
</style>
</head>
<body>
<div class="app">
  <aside><h1>saved-digest</h1><nav id="nav" aria-label="Groups"></nav></aside>
  <main>
    <div class="bar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search posts, summaries and transcripts" aria-label="Search posts">
        <button class="x" id="clear" hidden aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="view" role="group" aria-label="Layout">
        <button data-view="grid" aria-label="Grid view" title="Grid view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
        <button data-view="list" aria-label="List view" title="List view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="4" height="4" rx="1"/><rect x="4" y="15" width="4" height="4" rx="1"/><path d="M11 7h9M11 17h9"/></svg></button>
      </div>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
    <div id="list"></div>
  </main>
</div>
<script>
const TOKEN = '__TOKEN__';
const $ = (id) => document.getElementById(id);
// sticky stack: on phones the group tabs, then the search bar, then the current group's title
const phone = matchMedia('(max-width: 720px)');
const aside = document.querySelector('aside'), bar = document.querySelector('.bar');
const setHead = () => {
  document.documentElement.style.setProperty('--head', phone.matches ? aside.offsetHeight + 'px' : '0px');
  document.documentElement.style.setProperty('--bar', bar.offsetHeight + 'px');
};
const sizes = new ResizeObserver(setHead); sizes.observe(aside); sizes.observe(bar); phone.addEventListener('change', setHead);
const api = (path) => fetch('/api/' + path, { headers: { 'x-token': TOKEN } }).then((r) => {
  if (r.status === 401) location.reload(); // server restarted, so this page's token is stale
  return r.json();
});
let posts = [], group = 'All', timer, last = '';

const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>',
};

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}
const grpOf = (p) => p.grp ?? 'Unsorted';
const search = (q) => 'https://www.google.com/search?q=' + encodeURIComponent(q);
const shortUrl = (u) => { try { const x = new URL(u); return (x.host.replace(/^www\./, '') + x.pathname + x.search).replace(/\/$/, ''); } catch { return u; } };

function render() {
  const searching = !!$('q').value.trim();
  const groups = [...new Set(posts.map(grpOf))];
  if (!['All', ...groups].includes(group)) group = 'All';
  // Ignore is hidden from All unless searching, so a search can still find a post sorted there
  const inView = (g) => posts.filter((p) => (g === 'All' ? searching || p.grp !== 'Ignore' : grpOf(p) === g));
  const nav = $('nav');
  nav.replaceChildren();
  const navButton = (g) => {
    const b = el('button', { onclick: () => { group = g; render(); window.scrollTo(0, 0); } }, g, el('span', { className: 'n', textContent: inView(g).length }));
    b.setAttribute('aria-current', String(g === group));
    return b;
  };
  nav.append(...['All', ...groups].map(navButton));
  const shown = inView(group);
  $('count').textContent = searching ? shown.length + (shown.length === 1 ? ' result' : ' results') + ' for “' + $('q').value.trim() + '”' : '';
  $('clear').hidden = !$('q').value;
  const list = $('list');
  list.replaceChildren();
  if (!shown.length) return list.append(el('div', { className: 'empty', textContent: !posts.length ? 'No posts yet. Run a sync from the terminal.' : searching ? 'Nothing matches.' : 'Nothing here.' }));
  for (const g of new Set(shown.map(grpOf))) {
    if (group === 'All') list.append(el('div', { className: 'group-title', textContent: g }));
    list.append(el('div', { className: 'grid' }, ...shown.filter((p) => grpOf(p) === g).map(card)));
  }
}

function card(p) {
  const label = p.author ? '@' + p.author : 'post';
  const open = el('a', { href: p.url, target: '_blank', rel: 'noopener' });
  if (p.thumb) open.append(el('img', { src: '/thumb/' + p.thumb + '?t=' + TOKEN, alt: '', loading: 'lazy', decoding: 'async' }));
  else open.append(el('div', { className: 'ph', innerHTML: ICON.play + '<span>No preview yet</span>' }));
  open.setAttribute('aria-label', 'Open ' + label + ' on Instagram');

  // links to read or visit (a repo, a site, a tool): the address is shown so you know where it goes before clicking;
  // when the exact page is unknown it is a web search, and says so
  const links = p.resources.map((r) => {
    const kind = r.url ? 'url' : 'search';
    const query = r.search || r.name;
    const where = r.url ? shortUrl(r.url) : 'Search the web:\n' + query;
    const a = el('a', { href: r.url || search(query), target: '_blank', rel: 'noopener', title: r.url || 'Search the web for ' + query, innerHTML: r.url ? ICON.out : ICON.search }, el('span', { className: 'name', textContent: r.name }));
    // addresses may wrap after / or _ before breaking mid-word
    if (where.toLowerCase() !== r.name.toLowerCase()) a.append(el('span', { className: 'where' + (r.url ? ' url' : ''), textContent: r.url ? where.replace(/[/_]/g, '$&​') : where }));
    return { kind, a };
  });
  const order = ['url', 'search']; // page links first; a kind not listed here goes last
  const rank = (k) => (order.includes(k) ? order.indexOf(k) : order.length);
  const bubbles = Object.entries(Object.groupBy(links, (l) => l.kind)).sort(([x], [y]) => rank(x) - rank(y)).map(([, ls]) => ls).map((ls) => el('div', { className: 'bubble' }, ...ls.map((l) => l.a)));

  return el('article', { className: 'card' }, el('div', { className: 'thumb' }, open),
    el('div', { className: 'head' }, el('div', { className: 'author', textContent: label }),
      ...(p.tags.length ? [el('div', { className: 'tags', textContent: p.tags.slice(0, 4).join(' · ') })] : [])),
    el('div', { className: 'sum', textContent: p.summary || '(not summarised yet)' }),
    el('div', { className: 'links' }, ...bubbles)); // always present, even empty, to keep the 4 rows
}

async function load() {
  const next = await api('posts' + ($('q').value ? '?q=' + encodeURIComponent($('q').value) : ''));
  if (JSON.stringify(next) === last) return;
  last = JSON.stringify(next);
  posts = next;
  render();
}
// a sync running in another terminal shows up without a reload
setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
$('q').oninput = () => { $('clear').hidden = !$('q').value; clearTimeout(timer); timer = setTimeout(load, 200); };
$('clear').onclick = () => { $('q').value = ''; $('q').focus(); load(); };

// layout: remembered per browser once chosen; until then list on phones, grid elsewhere
const showView = (v) => {
  $('list').classList.toggle('list', v === 'list');
  for (const b of document.querySelectorAll('.view button')) b.setAttribute('aria-pressed', String(b.dataset.view === v));
};
let saved = null;
try { saved = localStorage.getItem('view'); } catch {}
showView(saved || (matchMedia('(max-width: 720px)').matches ? 'list' : 'grid'));
for (const b of document.querySelectorAll('.view button')) b.onclick = () => { showView(b.dataset.view); try { localStorage.setItem('view', b.dataset.view); } catch {} };
load();
</script>
</body>
</html>
